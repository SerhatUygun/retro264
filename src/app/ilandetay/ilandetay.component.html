<section class="listing-detail" *ngIf="listing">
    <div class="container">
      <h2>{{ listing.title }}</h2>
      <div class="carousel">
        <img [src]="listing.image" [alt]="listing.title">
      </div>
      <div class="details">
        <p class="price">{{ listing.price | currency:'USD' }}</p>
        <p><i class="fas fa-map-marker-alt"></i> {{ listing.location }}</p>
        <ul class="features">
          <li><i class="fas fa-bed"></i> {{ listing.bedrooms }} Bedrooms</li>
          <li><i class="fas fa-bath"></i> {{ listing.bathrooms }} Bathrooms</li>
          <li><i class="fas fa-ruler-combined"></i> {{ listing.area }} m²</li>
        </ul>
        <p class="description">{{ listing.description }}</p>
      </div>
      <div class="map">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.835434509374!2d144.9537353153167!3d-37.81627927975171!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzfCsDQ5JzU4LjYiUyAxNDTCsDU3JzEzLjUiRQ!5e0!3m2!1sen!2sau!4v1611812312345!5m2!1sen!2sau"
          width="100%"
          height="400"
          frameborder="0"
          style="border:0;"
          allowfullscreen=""
          aria-hidden="false"
          tabindex="0">
        </iframe>
      </div>
    </div>
  </section>
